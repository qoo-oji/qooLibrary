# XcodeGen spec for qooLibrary.xcodeproj. Regenerate after editing with:
#   xcodegen generate
#
# The .xcodeproj itself is git-ignored (regenerated from this file), matching
# the philosophy already used for vendored ThirdParty binaries: a generated
# artifact that's reproducible from source is not committed. This also keeps
# project-file conflicts out of code review — edit project.yml, not pbxproj.
name: qooLibrary
options:
  bundleIdPrefix: com.qoolibrary
  deploymentTarget:
    # macOS 26 で追加された `dragContainer`/`draggable(containerItemID:)`
    # （List での複数選択ドラッグを正しく実現する唯一の API、1-6 で採用）を
    # 使うため 15.0 から引き上げた [設計判断]。
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  qooLibraryPackage:
    path: .

targets:
  qooLibraryApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/qooLibraryApp
      - path: Resources/DesignTokens.json
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: qooLibraryPackage
        product: QooKit
      - package: qooLibraryPackage
        product: QooPersistence
      - package: qooLibraryPackage
        product: QooInfrastructure
      - package: qooLibraryPackage
        product: QooApplication
    # `GENERATE_INFOPLIST_FILE: YES` の「ビルド設定から自動生成」方式は
    # スカラー値の `INFOPLIST_KEY_*` しか表現できず、`CFBundleDocumentTypes`
    # のようなネストした配列・辞書を持たせられない。XcodeGen の `info:`
    # ブロック（実ファイルとして Info.plist を書き出し `INFOPLIST_FILE` を
    # 自動設定する仕組み）に切り替え、既存の3キー（コピーライト表記／
    # アプリカテゴリ／プリンシパルクラス）もこちらへ移した
    # [ユーザー要望: qooLibrary を Finder の「このアプリケーションで開く」の
    # 対象にする、CLAUDE.md「将来検討」参照]。XcodeGen 自身が
    # `CFBundleIdentifier`/`CFBundleExecutable`/`CFBundlePackageType` 等の
    # 必須キーを自動的に補うため、ここには追加したいキーだけを書けばよい
    # （XcodeGen の `InfoPlistGenerator.swift` で確認済み）。
    info:
      path: Sources/qooLibraryApp/Info-Generated.plist
      properties:
        NSHumanReadableCopyright: "Copyright © 2026 Kosuke Nishimura. MIT licensed (Sources/); see THIRD-PARTY-NOTICES.md for vendored components."
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Finder でフォルダ・アーカイブを右クリック →「このアプリケーションで
        # 開く」→ qooLibrary を選べるようにする。`LSHandlerRank: Alternate`
        # は既定アプリを奪わず候補に加わるだけの指定 [設計判断]。実際に
        # 選ばれた URL の受け口は 1-9 で「新規ウインドウで開く」用に実装済みの
        # `WindowGroup(for: URL.self)` がそのまま使える見込み（実機検証が必要）。
        #
        # [実機検証で発見: 独自 UTI（`com.qoolibrary.cbz` 等）を宣言していたが
        # Finder の「このアプリケーションで開く」に候補として出なかった。
        # `mdls -name kMDItemContentType` で実際の .cbz/.cbr/.cb7/.7z/.rar
        # ファイルを調べたところ、macOS は独自 UTI ではなく標準の
        # `public.cbz-archive`/`public.cbr-archive`/`public.cb7-archive`/
        # `org.7-zip.7-zip-archive`/`com.rarlab.rar-archive` にファイルを
        # 解決していることが判明した（いずれも macOS 標準搭載の UTI、
        # 独自宣言は不要かつ実際のファイルとは一致しないため無意味だった）。
        # `UTExportedTypeDeclarations` は撤去し、`LSItemContentTypes` を
        # これら実際の標準 UTI に置き換えて解消した]。
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            LSItemContentTypes: [public.folder]
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
          - CFBundleTypeName: Archive
            LSItemContentTypes:
              - public.zip-archive
              - public.cbz-archive
              - org.7-zip.7-zip-archive
              - public.cb7-archive
              - com.rarlab.rar-archive
              - public.cbr-archive
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
          # [ユーザー要望: qooLibrary は qooViewer のフロントエンドとして
          # 設計されており、qooViewer が対応するファイル形式（PDF・EPUB）は
          # qooLibrary 側でも網羅する必要がある]。`com.adobe.pdf`・
          # `org.idpf.epub-container` はどちらも macOS 標準搭載の UTI
          # （上記アーカイブ群と同じ調査方法、`mdls -name kMDItemContentType`
          # で確認可能）で、独自 UTI 宣言は不要。
          - CFBundleTypeName: Document
            LSItemContentTypes:
              - com.adobe.pdf
              - org.idpf.epub-container
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
    settings:
      base:
        PRODUCT_NAME: qooLibrary
        PRODUCT_BUNDLE_IDENTIFIER: com.qoolibrary.app
        MARKETING_VERSION: "0.10"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_ENTITLEMENTS: Sources/qooLibraryApp/qooLibrary.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
