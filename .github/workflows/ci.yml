name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 01_プロジェクト構成とビルド.md §1.2: Release / Release-Permissive の 2 構成。
  # 既定構成 (permissive=false) は libarchive + UnRAR の両方が必要。
  # PERMISSIVE_ONLY_BUILD (permissive=true) は UnRAR 関連ターゲットが
  # Package.swift から除外されるため、Scripts/build-unrar.sh は実行しない
  # ([Sources/QooUnrarBridge] 節、Package.swift 参照)。
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        permissive: [false, true]
    steps:
      - uses: actions/checkout@v4
      - name: Build libarchive
        run: Scripts/build-libarchive.sh
      - name: Build UnRAR
        if: ${{ !matrix.permissive }}
        run: Scripts/build-unrar.sh
      - name: swift build (default)
        if: ${{ !matrix.permissive }}
        run: swift build
      - name: swift build (PERMISSIVE_ONLY_BUILD)
        if: ${{ matrix.permissive }}
        run: PERMISSIVE_ONLY_BUILD=1 swift build

  # B-10〜B-13: 静的検査。コンパイル不要のテキストスキャンなのでビルドに
  # 依存させず高速に回す。
  static-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: FileOps isolation [FO-02] (B-10)
        run: swift Scripts/check-fileops-isolation.swift
      - name: Layer dependencies [A-01] (B-11)
        run: swift Scripts/check-layer-dependencies.swift
      - name: JSON completeness [MG-23] (B-13)
        run: swift Scripts/check-json-completeness.swift
      - name: Localization keys defined [ER-03]
        run: swift Scripts/check-localization-keys.swift
      - name: Cancellation works off the cooperative pool [NV6-01]
        run: swift Scripts/check-cancellation-usage.swift
      - name: Expected change ledger is registered before the operation [FO-11]
        run: swift Scripts/check-change-ledger.swift

  # QooKitTests。カバレッジ 80% 未満で失敗させる方針だが、テスト対象コードが
  # まだ存在しないフェーズ 0 の時点では実行のみ確認する [MT-01]。
  unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libarchive
        run: Scripts/build-libarchive.sh
      - name: Build UnRAR
        run: Scripts/build-unrar.sh
      # **CI では直列実行にする（--no-parallel）。** GitHub の macOS ランナーは
      # 3〜4 コアしかなく、並列実行だと時間・並行性に敏感なスイート
      # （FileIOTests〈意図的に協調プールへ負荷をかける〉・
      # DirectoryWatchIntegrationTests〈FSEvents の到達を待つ〉・
      # ReplaceBackupJournalTests〈コピーの最中を観測する〉）が互いに
      # 枯渇させ合って落ちる（2026-08、6 時間ハング解消後の初回の完走で
      # 4 系統が同時刻に失敗して発覚）。並列実行が炙り出す類の不具合は、
      # 開発機（10 コア）でのローカル実行が引き続き並列なのでそちらで拾う。
      - name: swift test
        run: swift test --no-parallel

  # qooLibraryApp: 実際の Xcode アプリターゲット [1-1]。project.yml から
  # XcodeGen で生成する（.xcodeproj 自体は git-ignore、Package.swift の
  # xcframework 群と同じ「生成物はコミットしない」方針）。
  app-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libarchive
        run: Scripts/build-libarchive.sh
      - name: Build UnRAR
        run: Scripts/build-unrar.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate qooLibrary.xcodeproj
        run: xcodegen generate
      - name: xcodebuild
        run: xcodebuild -project qooLibrary.xcodeproj -scheme qooLibraryApp -configuration Debug build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

  # LC-05: THIRD-PARTY-NOTICES.md の更新漏れ検出。
  license:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check THIRD-PARTY-NOTICES.md is updated when ThirdParty/ changes
        run: |
          set -eu
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          # ThirdParty/ の変更（ベンダリング）と、SwiftPM の依存の変更
          # （Package.swift / Package.resolved）の両方を見る [LC-05]。
          if echo "$CHANGED" | grep -qE '^(ThirdParty/|Package\.swift$|Package\.resolved$)'; then
            if ! echo "$CHANGED" | grep -q '^THIRD-PARTY-NOTICES\.md$'; then
              echo "!! dependencies changed but THIRD-PARTY-NOTICES.md was not updated [LC-05]"
              echo "   changed:"; echo "$CHANGED" | grep -E '^(ThirdParty/|Package\.)'
              exit 1
            fi
          fi
          echo "==> OK"
